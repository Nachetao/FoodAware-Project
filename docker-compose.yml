services:
  db:
    image: postgres:15
    container_name: foodaware_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-foodaware}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  python-service:
    build:
      context: ./python-service
    container_name: foodaware_python
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: foodaware_backend
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db
      - python-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: foodaware_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
