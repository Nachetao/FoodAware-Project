server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # El service worker y su manifiesto siempre se revalidan: si quedaran en
    # caché HTTP, una versión nueva de la app tardaría en llegar.
    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
