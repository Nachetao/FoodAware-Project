<!DOCTYPE html>
<html lang="es" translate="no">

<head>
  <meta charset="utf-8" />
  <title>FoodAware</title>
  <!-- La app está en español: evita que el navegador ofrezca traducirla y altere el DOM de Ionic. -->
  <meta name="google" content="notranslate" />

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <!-- Sin maximum-scale ni user-scalable=no: se puede hacer zoom (WCAG 1.4.4). -->
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- PWA: manifiesto, color de la barra del sistema e ícono de iOS. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#00473c" />
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
