name: CI Python (FastAPI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./python-service

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python v3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar las dependencias
        run: pip install -r requirements.txt

      - name: Auditar dependencias vulnerables
        run: pip audit

      - name: Ejecutar analisis de calidad
        run: |
          pip install flake8
          flake8 .

      - name: Ejecutar pruebas unitarias
        run: |
          pip install pytest
          pytest
