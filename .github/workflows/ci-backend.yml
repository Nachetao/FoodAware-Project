name: CI Backend (NestJS)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Una ejecución nueva cancela la anterior de la misma rama o PR; en main
# cada commit termina la suya.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Misma versión que backend/Dockerfile.
  NODE_VERSION: ${{ vars.NODE_VERSION_BACKEND || '20' }}

jobs:
  build:
    name: Lint, pruebas y auditoría
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias vulnerables
        run: npm audit --audit-level=critical

      - name: Ejecutar analisis de calidad
        run: npm run lint

      - name: Ejecutar pruebas unitarias
        run: npm run test
