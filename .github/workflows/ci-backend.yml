name: CI Backend (NestJS)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Una ejecución nueva cancela la anterior de la misma rama o PR; en main
# cada commit termina la suya.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Misma versión que backend/Dockerfile.
  NODE_VERSION: ${{ vars.NODE_VERSION_BACKEND || '22' }}

jobs:
  build:
    name: Lint, pruebas y auditoría
    runs-on: ubuntu-latest

    # PostgreSQL desechable para npm run test:postgres: nace y muere con el
    # job, sin datos reales. La contraseña no es un secreto: solo sirve para
    # este contenedor, que no es accesible desde fuera del runner. Por eso
    # sus dos líneas llevan "gitleaks:allow" (Gitleaks las marcaría por la
    # palabra PASSWORD y la entropía del valor).
    services:
      postgres:
        # Misma versión que docker-compose.yml y render.yaml.
        image: postgres:15
        env:
          POSTGRES_USER: foodaware
          POSTGRES_PASSWORD: postgres-ci-efimera # gitleaks:allow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodaware"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias vulnerables
        run: npm audit --audit-level=critical

      - name: Ejecutar analisis de calidad
        run: npm run lint

      - name: Ejecutar pruebas unitarias
        run: npm run test

      # Levantan la app completa contra un FastAPI simulado (servidor HTTP
      # local) y repositorios en memoria: sin Docker, sin PostgreSQL y sin
      # llamar a Open Food Facts.
      - name: Ejecutar pruebas de integración (FastAPI simulado)
        run: npm run test:integration

      # Las mismas migraciones y repositorios de producción contra el
      # PostgreSQL del servicio de arriba. Cada ejecución crea una base
      # foodaware_prueba_* y la borra al terminar.
      - name: Ejecutar pruebas con PostgreSQL real
        env:
          PRUEBA_DB_HOST: localhost
          PRUEBA_DB_PORT: 5432
          PRUEBA_DB_USER: foodaware
          PRUEBA_DB_PASSWORD: postgres-ci-efimera # gitleaks:allow
        run: npm run test:postgres
