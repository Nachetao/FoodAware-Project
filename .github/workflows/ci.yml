# Lint, pruebas y detección de secretos viven en sus propios workflows
# (ci-backend, ci-python, ci-security). Este solo verifica que las imágenes
# de Docker Compose construyan; pasará al workflow de integración.
name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Una ejecución nueva cancela la anterior de la misma rama o PR; en main
# cada commit termina la suya.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Construir imágenes (docker compose)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate infrastructure build
        run: docker compose build
