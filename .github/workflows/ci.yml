name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Detectar secretos en el código
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate infrastructure build
        run: docker compose build

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Run Lint (Backend)
        run: cd backend && npm run lint

      - name: Run Unit Tests (Backend)
        run: cd backend && npm run test

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: cd python-service && pip install -r requirements.txt flake8 pytest

      - name: Run Lint (Python)
        run: cd python-service && flake8 .

      - name: Run Unit Tests (Python)
        run: cd python-service && pytest